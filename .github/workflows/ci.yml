name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      appetize:
        # The free Appetize minutes are used up, so the browser-test upload no longer runs on
        # every push (it held a macOS runner for ~4 min each time). Kept for a manual run.
        description: Also build the simulator app and upload it to Appetize
        type: boolean
        default: false
  # testflight.yml runs CI for the commit it uploads, in the same run (release: true).
  workflow_call:
    inputs:
      release:
        description: Called by testflight.yml (own concurrency group, the iOS job always runs)
        type: boolean
        default: false

# Read-only token: no job writes to the repository.
permissions:
  contents: read

env:
  # brew would otherwise update itself first (about a minute per macOS job).
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

# A new push to the same branch or PR cancels the run of the previous one. Called by
# testflight.yml, CI has a group of its own for that TestFlight run, so a push to main never
# cancels the tests of a build: release: true says so, and github.workflow, the caller's name
# "TestFlight" in a called workflow, is a second guard. CI is not in the Mac queue of the UI
# runs and stress passes (ui.yml, "concurrency"); see the ios job.
concurrency:
  group: >-
    ${{ (inputs.release || github.workflow == 'TestFlight') && format('testflight-ci-{0}', github.run_id)
    || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  lint:
    # Fast checks that need no compiler; they fail within seconds.
    name: App rules and strings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Navigation rule
        # Screens opened in code are pushed by value onto a NavigationRoot's path (AppScreen).
        # No navigationDestination(isPresented:/item:) (presented again and again, main thread
        # stood up to 352 s), no NavigationLink(value:) (PushLink instead), and every stack is a
        # NavigationRoot, so no pushed value leads nowhere (dead row, warning triangle).
        run: python3 .github/scripts/navigation_rule.py .
      - name: Spinner rule
        # A bare spinner is an element with no description (accessibility audit, VoiceOver).
        run: python3 .github/scripts/spinner_rule.py .
      - name: Secondary text rule
        # Small grey text (footnote, caption, subheadline) uses .noteText (Theme.noteText, 4.6:1
        # and more), not the system grey .secondary (3.4:1 on a white card; review P3-14).
        run: python3 .github/scripts/secondary_text_rule.py .
      - name: Every UI string has English
        run: python3 .github/scripts/check_strings.py .
      - name: Code map lists every Swift file
        run: python3 scripts/gen_codemap.py --check
      - name: CI scripts (unit tests)
        # The retry rule of the UI jobs (ui_tests.py) and the test gate (ci_gate.py), with log
        # snippets of real runs: a simulator failure is repeated, a real finding never.
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Time limits only loosened with an entry
        # Review P5-13: Build 36 came from a commit that only let a test wait 20 s instead of 5 s.
        # A longer timeout in a test or a timeout-minutes in a workflow needs a row in
        # docs/IMPROVEMENTS.md with "Zeitgrenze gelockert" and the file's name in the same pull
        # request or push (docs/TESTFLIGHT.md). Fetches the commit it compares with.
        run: python3 .github/scripts/time_limit_rule.py --base auto
      - name: SwiftLint only loosened with an entry
        # The SwiftLint job fails on findings beyond .github/swiftlint-baseline.json. A raised count
        # there needs a row with "SwiftLint gelockert" and the file's name in docs/IMPROVEMENTS.md, a
        # change to .github/swiftlint.yml a line naming it, in the same pull request or push.
        run: python3 .github/scripts/swiftlint_rule.py --base auto
      - name: Test-plan map names real tests
        # Warnings only: a stale name in docs/TEST_COVERAGE_MAP.txt makes a case look untested
        # in the job summary, it does not make the app worse.
        run: python3 .github/scripts/test_summary.py map-check

  swiftlint:
    # Fuchs 20.11.: SwiftLint, Periphery and Xcode's analyzer after Build 40. The pinned SwiftLint
    # (.github/lint-tools.json, toolchain.py swiftlint) lints the app, the core package and the
    # tests with the settings in .github/swiftlint.yml. Findings from before it ran are counted in
    # .github/swiftlint-baseline.json; more findings of a rule in a file than counted there fail the
    # job, and so does a SwiftLint that did not lint or warned about its setup
    # (swiftlint_report.py). A TestFlight run leaves it out (it checks the commit, not the build).
    # No cache (rule since the CodeQL incident): --no-cache.
    name: SwiftLint
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A downloaded tool runs here: it never sees a token in .git/config.
          persist-credentials: false
      - name: Install Python
        run: bash .github/scripts/apt_install.sh python3
      - name: Install the pinned SwiftLint
        run: python3 .github/scripts/toolchain.py swiftlint
      - name: Lint (new findings fail)
        run: |
          mkdir -p swiftlint
          set +e
          swiftlint-static lint --config .github/swiftlint.yml --no-cache --quiet --reporter json \
            App Sources Tests Package.swift > swiftlint/findings.json 2> swiftlint/stderr.txt
          status=$?
          set -e
          cat swiftlint/stderr.txt >&2
          # Also in the log: the job summary cannot be read through the API, the log can.
          python3 .github/scripts/swiftlint_report.py --status "$status" --stderr swiftlint/stderr.txt \
            --baseline .github/swiftlint-baseline.json --write-counts swiftlint/counts.json \
            swiftlint/findings.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the report and the counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftlint
          path: swiftlint/
          if-no-files-found: ignore
          retention-days: 14

  changes:
    # Decides whether the macOS job has to run: it is skipped when only *.md / docs/ changed
    # since the last commit whose iOS tests passed (pull_request path filters cannot do this,
    # they look at the whole PR diff). Not in a TestFlight run: there the iOS job always runs,
    # so the run tests the commit it uploads itself.
    name: Changes
    if: ${{ !inputs.release }}
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      actions: read

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    # Hang limits (20.11.2026: the core tests hung 30 min, until this job's limit of 30), from the
    # green jobs since 16.11. (fourth review: at least the longest seen + 50 % and twice the 95th
    # percentile): this job (97 in CI) p95 9.7, longest 18.9 min (11.6 of it apt during the mirror
    # outage), so 30 for the container, apt's retries and both test steps; "Build and test" (158
    # jobs) p95 4.7, longest 5.8: watchdog 10, step 12; load test p95 3.2, longest 3.3: watchdog
    # 7, step 9. swift_test_watch.py stops a step's tests before its timeout-minutes and names the
    # tests still running (TEST_HANG), so the log says which test hung; a hang is red like any
    # failing test, never re-run.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite headers
        run: bash .github/scripts/apt_install.sh libsqlite3-dev python3
      - name: Build and test
        timeout-minutes: 12
        run: python3 .github/scripts/swift_test_watch.py --minutes 10 --log core-linux.log -- swift test --parallel
      - name: Load test (20,000 and 100,000 photos, time and memory limits)
        timeout-minutes: 9
        run: |
          set +e
          ALBUMIST_LOAD_TEST=1 python3 .github/scripts/swift_test_watch.py --minutes 7 --quiet --log load.log -- \
            swift test --skip-build --filter LoadTests
          status=$?
          grep -E "LOAD_|passed|failed|error" load.log
          exit $status
      - name: Job summary
        if: always()
        run: |
          python3 .github/scripts/test_summary.py summary --title "Core tests (Linux)" \
            --swift-log core-linux.log --swift-log load.log --load-log load.log >> "$GITHUB_STEP_SUMMARY" || true

  ios:
    name: iOS build and tests (macOS)
    # Fast first, then expensive (Fuchs 15.11.): the Mac job starts only when the Linux core
    # tests and the app rules passed. It still runs unless the changes job positively found a
    # docs-only change (also when that job failed).
    # Not in the Mac queue ("mac-queue", ui.yml) on purpose: this is the quick verdict of every
    # push (one Mac, ~20 min). In the queue it would wait behind the UI run of its own commit
    # (about an hour), and since GitHub keeps only one waiting run per group, the next run to
    # join would cancel it. Per branch only the newest CI run goes on (concurrency above).
    needs: [changes, lint, core-linux]
    # Not for a Dependabot pull request: a version bump uses no Mac by itself; its UI run by hand
    # before the merge builds and tests the app (ui.yml, "concurrency").
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.lint.result == 'success' && needs.core-linux.result == 'success' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: xcode-27
    # 64 green jobs since 16.11.: p95 28.6, longest 32.4 min; the longest + 50 % is 49 (fourth
    # review of the tempo plan; was 45, entry "Zeitgrenze gelockert" in docs/IMPROVEMENTS.md).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        # Xcode and simulator runtime pinned in .github/toolchain.json; the job stops when the
        # image lacks them.
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256. Its own step:
        # a failed download is machinery for "Re-run failed jobs" (earlier_attempts.py); a
        # failed project generation is not.
        if: hashFiles('App/project.yml') != ''
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Generate Xcode project
        if: hashFiles('App/project.yml') != ''
        run: cd App && xcodegen generate
      - name: Pick simulator
        if: hashFiles('App/project.yml') != ''
        id: sim
        # Not booted early on purpose (booted in "Fresh simulator" after the core tests): a first boot competes with the package build for the
        # three cores and made both several minutes slower (run 43749559109).
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py --role default)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build app and its tests
        # Compile first (tempo plan 20.11.): the app and its unit tests are built before the
        # macOS core tests (5-6 min) and the fresh simulator (2-10 min), so a compile error that
        # only the Mac finds is red about 12 min after the push instead of 27 (61e9b8c,
        # PHPersistentChangeFetchResult.enumerateChanges: CI red after 27.1 min). The simulator
        # is not booted yet (nothing competes with the build, see "Pick simulator"). "Build and
        # test app" below builds again with the same settings and finds nothing to compile.
        # Only this build's failure stops the core tests and the app tests below (a failed
        # "Build UI tests" does not: those steps ask for this one's outcome).
        id: appbuild
        if: steps.sim.outputs.udid != ''
        run: |
          cd App
          xcodebuild build-for-testing \
            -project Albumist.xcodeproj \
            -scheme Albumist \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1 \
            || { grep -E "error:" -A3 ../build-log.txt | grep -v "/SourcePackages/" | head -80; echo "--- last 30 lines of the build log"; tail -30 ../build-log.txt; exit 1; }
          tail -2 ../build-log.txt
      - name: Build UI tests
        # The UI tests run in their own workflow (ui.yml); building them here finds a compile
        # error in them within minutes of this job instead of after the long simulator setup
        # there. Right after the app's build (tempo plan 20.11.), before the core tests and the
        # simulator, with the same build settings, so the app is not compiled a second time.
        # Not in a TestFlight run (release): there ui.yml's "UI build" builds exactly this
        # (scheme AlbumistUI, build-for-testing) right after this job, in the same run, and a
        # compile error stops the upload there (about 1 min of this Mac, TestFlight run
        # 44461253154). test_workflows.py ReleaseSkipTests: a step left out in release mode is
        # one whose build ui.yml really does itself.
        if: steps.sim.outputs.udid != '' && !inputs.release
        run: |
          cd App
          xcodebuild build-for-testing \
            -project Albumist.xcodeproj \
            -scheme AlbumistUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-ui-log.txt 2>&1 \
            || { grep -E "error:" -A3 ../build-ui-log.txt | grep -v "/SourcePackages/" | head -80; echo "--- last 30 lines of the build log"; tail -30 ../build-ui-log.txt; exit 1; }
          grep -E "warning: .*AlbumistUITests" ../build-ui-log.txt | head -40 || true
          tail -2 ../build-ui-log.txt
      - name: Core tests (macOS)
        # Also after a failed "Build UI tests" (its error is in the log above; the app's own
        # tests still say what they find). Not after a failed app build or an earlier step.
        # Hang limit from 64 green jobs: p95 6.3, longest 8.3 min, so watchdog 13 (twice the p95,
        # above the longest + 50 %), step 15; the watchdog names the tests still running
        # (swift_test_watch.py, as in the Linux job).
        id: core
        if: ${{ !cancelled() && (steps.appbuild.outcome == 'success' || (success() && steps.sim.outputs.udid == '')) }}
        timeout-minutes: 15
        run: |
          mkdir -p build
          python3 .github/scripts/swift_test_watch.py --minutes 13 --log build/core-macos.log -- swift test --parallel
      - name: Fresh simulator (erased and booted)
        # 18.11.: StoreKit listed no product for 300 s in four runs from ~16:00 UTC on, with no
        # error, also on claude/next at 3dfda45 (CI 44369338871), whose code was green in every
        # run before (until 10:10 UTC) and whose image, Xcode, runtime and simulator were the same
        # (20261103.629, Xcode 27.2, iOS 27.2 24B8117, iPhone 17e). So the cause is in the
        # environment (runner, simulator or Apple's services), not in the app or test code. The
        # simulator now starts erased (no state from the image; it may well have been fresh
        # already, so this alone may not help), booted after the core tests (nothing competes
        # with the boot then), and its StoreKit log is recorded live: after xcodebuild has shut
        # it down, `log show` gave only "<compose failure>" lines from after a new boot
        # (CI 44368423344). Boot like ui_tests.py: up to three attempts, each counted.
        # After the fresh boot the whole Mac was starved for 2-3 min: even a one-file
        # hashFiles('App/project.yml') timed out after 120 s (CI 44376522818; under 1 s before the
        # boot). So the step waits like every UI pass (ui_tests.py settle) until the simulator
        # answers a trivial process (launchctl) twice in a row in under 2 s, at most 5 min; every
        # probe and the 1-minute load are in the log as SIM_SETTLE, the busiest processes as
        # SIM_TOP. The load is not the criterion any more: it stayed at 200-850 for minutes even
        # in green runs (CI 44437759869, 44397301952), so "under 3.5" always waited the whole
        # 5 min. The later steps ask whether a simulator was picked (only when App/project.yml
        # exists) instead of hashFiles().
        # CI 44383157858 and 44390350152 (erased and booted): StoreKit served the test host from
        # the App Store's sandbox, not from the local configuration. Both: "Error updating
        # Storefront ... environment: Optional("Sandbox")"; storekitd ran the product request as
        # "[Client] app.albumist.ios (Albumist) Sandbox" against the Media API and logged "Ignoring
        # empty product response" (44390350152, network up: empty list, no error), or it failed
        # with URLError -1009 (44383157858). The test session now comes before the test process's
        # first StoreKit call (PurchaseStoreKitTests, StoreKitEnvironment).
        id: fresh
        if: ${{ !cancelled() && steps.appbuild.outcome == 'success' && steps.core.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl shutdown "$UDID" > /dev/null 2>&1 || true
          xcrun simctl erase "$UDID"
          for attempt in 1 2 3; do
            xcrun simctl boot "$UDID" > /dev/null 2>&1 || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null && break
            [ "$attempt" = 3 ] && { echo "simulator did not boot (3 attempts)"; exit 1; }
            echo "FLAKY_BOOT bootstatus failed (attempt $attempt of 3), retrying"
            echo "::warning title=Environment retry (simulator boot)::bootstatus failed (attempt $attempt of 3), erased simulator booted again; counted, a finding to fix, not a test result"
            echo "- Environment retry (simulator boot): attempt $attempt of 3 failed" >> "$GITHUB_STEP_SUMMARY"
            xcrun simctl shutdown "$UDID" > /dev/null 2>&1 || true
            sleep 15
          done
          python3 .github/scripts/ui_tests.py settle --udid "$UDID"
          nohup xcrun simctl spawn "$UDID" log stream --style compact --level debug \
            --predicate 'process CONTAINS[c] "storekit" OR subsystem CONTAINS[c] "storekit" OR process == "appstored" OR process == "itunesstored" OR subsystem == "com.apple.AppleMediaServices"' \
            > storekit-live.log 2>&1 &
          echo "simulator $UDID erased and booted; StoreKit log recorded live (pid $!)"
      - name: Build and test app
        if: ${{ !cancelled() && steps.appbuild.outcome == 'success' && steps.core.outcome == 'success' && steps.fresh.outcome == 'success' }}
        run: |
          echo "LOAD at start: $(sysctl -n vm.loadavg)"
          ps -Ao pcpu=,state=,comm= -r | head -8 | cut -c1-160 | sed 's/^/SIM_TOP at start /'
          set +e
          cd App
          xcodebuild test \
            -project Albumist.xcodeproj \
            -scheme Albumist \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../build/TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          # StoreKit's own lines too (SKTestSession, StoreKitServiceError with its environment):
          # "[SKTestSession] Error saving configuration file: ... SKInternalErrorDomain" names no
          # "error:" and stayed in the artifact, where it cannot be read when the download fails.
          grep -E "error:|warning: .*Albumist|test host signed ad hoc|STOREKIT|SKTestSession|SKInternalErrorDomain|StoreKitServiceError|Test Suite|Test case|Executed|TAXONOMY|VISION_IDENTIFIERS|PREVIEW_JPEG|\*\* |✘|recorded an issue|Test run with|Testing failed|Fatal error|crashed" ../build-log.txt | grep -v "/SourcePackages/" | head -3000
          # Whether the test session's configuration reached the simulator: storekitd keeps it in
          # its app group under Persistence/Octane/<bundle id>/Configuration.storekit (Apple
          # forum 826971, FB22237318: "Missing" when SKTestSession could not save it). In green
          # runs too, so a red one can be compared; nothing listed in both says nothing.
          find "$HOME/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}/data/Containers/Shared/AppGroup" \
            -maxdepth 6 -path "*/Persistence/Octane*" -exec ls -ld {} + 2>&1 | head -20 | sed 's/^/OCTANE /'
          echo "OCTANE end of list (empty: no Octane folder in the simulator's app groups)"
          exit $status
      - name: StoreKit daemon log
        # Only when the StoreKit test environment never came up: what the simulator's StoreKit
        # daemon said during the tests (recorded live, see "Fresh simulator") and whether Apple's
        # store hosts answer from this runner, so the cause is in the job log (the build log is
        # an artifact). Also after a cancel: CI 44383157858 was cancelled from outside the job
        # seconds before the failed test step ended (no timeout, no newer run), and the step was
        # skipped, with the store hosts unchecked.
        if: (failure() || cancelled()) && steps.sim.outputs.udid != ''
        run: |
          if [ -f build-log.txt ] && grep -q "StoreKit test environment not" build-log.txt; then
            [ -f storekit-live.log ] && echo "StoreKit log: $(wc -l < storekit-live.log | tr -d ' ') lines" || echo "no live StoreKit log"
            # CI 44390350152: the last 300 lines below were all product requests from the last
            # minute; what storekitd did with the session's configuration at set-up was cut off.
            echo "--- how storekitd classed this app's requests ([Client] bundle id (name) environment)"
            grep -aoE "\[Client\] [^ ]+ \([^)]*\) [A-Za-z]+" storekit-live.log | sort | uniq -c || true
            echo "--- StoreKit Testing in Xcode: storekitd's XcodeTest and Octane lines (first 150)"
            grep -aE "XcodeTest|Octane|SKTestSession" storekit-live.log | head -150 || true
            echo "--- errors and failures (last 300)"
            grep -iE "error|fail|denied|timed? ?out|invalid|unable|refus|not (found|allowed|available)|configuration|products?|sandbox|octane|storefront|environment" storekit-live.log | tail -300 || true
            echo "--- last 200 lines"
            tail -200 storekit-live.log || true
            echo "--- Apple store hosts from this runner (connect time: a hang shows as a long one or as the 15 s limit)"
            for url in https://bag.itunes.apple.com/bag.xml https://buy.itunes.apple.com https://xp.apple.com; do
              curl -sS -o /dev/null -m 15 -w "$url: HTTP %{http_code}, connect %{time_connect} s, total %{time_total} s\n" "$url" 2>&1 || true
            done
          fi
      - name: Export strings for translation
        if: success() && steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          cd App
          xcodebuild -exportLocalizations -project Albumist.xcodeproj -localizationPath ../build/loc -exportLanguage en CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tail -3
          find ../build/loc -name "*.xliff" -exec sh -c 'base64 -i "$1" | tr -d "\n" | fold -w 4000 | sed "s/^/XLIFF /"' _ {} \;
      - name: Upload strings
        if: success() && steps.sim.outputs.udid != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localizations
          path: build/loc
          if-no-files-found: ignore
          retention-days: 7
          # "Re-run failed jobs" may upload it again under the same name.
          overwrite: true
      - name: Job summary
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult > build/app-tests.json 2>/dev/null || true
          python3 .github/scripts/test_summary.py summary --title "iOS build and tests (macOS)" \
            --swift-log build/core-macos.log --xcresult-json build/app-tests.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always() && steps.sim.outputs.udid != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: |
            build-log.txt
            build/TestResults.xcresult
            storekit-live.log
          if-no-files-found: ignore
          retention-days: 7
          # "Re-run failed jobs" uploads it again under the same name.
          overwrite: true

  simulator:
    # Manual only (workflow_dispatch input "appetize"): builds the simulator app and uploads it
    # to Appetize for browser testing.
    name: Simulator app for browser testing
    if: github.event_name == 'workflow_dispatch' && inputs.appetize
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256. Its own step:
        # a failed download is machinery for "Re-run failed jobs" (earlier_attempts.py); a
        # failed project generation is not.
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Generate Xcode project
        run: cd App && xcodegen generate
      - name: Build simulator app for browser testing
        run: |
          set -o pipefail
          mkdir -p build
          cd App
          xcodebuild build \
            -project Albumist.xcodeproj \
            -scheme Albumist \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/sim \
            CODE_SIGNING_ALLOWED=NO > ../build/sim-build.log 2>&1 \
            || { grep -E "error:" -A3 ../build/sim-build.log | head -60; exit 1; }
          tail -5 ../build/sim-build.log
          cd ../build/sim/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Albumist.app ../../../../Albumist-simulator.zip
          ls -la ../../../../Albumist-simulator.zip
      - name: Upload simulator app
        if: success() && hashFiles('build/Albumist-simulator.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Albumist-simulator-app
          path: build/Albumist-simulator.zip
          retention-days: 30
          # "Re-run failed jobs" may upload it again under the same name.
          overwrite: true
      - name: Upload to Appetize for browser testing
        # Runs only when the repository has the secret APPETIZE_TOKEN. Keeps one app
        # (note "sortly-ci") and updates it, so the test link stays the same.
        if: success() && hashFiles('build/Albumist-simulator.zip') != ''
        continue-on-error: true
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then echo "No APPETIZE_TOKEN secret, skipping."; exit 0; fi
          key=$(curl -sS -H "X-API-KEY: $APPETIZE_TOKEN" https://api.appetize.io/v1/apps \
            | jq -r '[.data[]? | select(.note == "sortly-ci")][0].publicKey // empty')
          url=https://api.appetize.io/v1/apps${key:+/$key}
          curl -sS --fail-with-body -X POST "$url" -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@build/Albumist-simulator.zip" -F "platform=ios" -F "note=sortly-ci" > appetize.json
          key=$(jq -r '.publicKey' appetize.json)
          echo "APPETIZE_LINK https://appetize.io/app/$key"
          echo "### Im Browser testen: https://appetize.io/app/$key" >> "$GITHUB_STEP_SUMMARY"
