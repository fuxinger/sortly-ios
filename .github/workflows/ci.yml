name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Build and test
        run: swift test --parallel

  ios:
    name: iOS build and tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Core tests (macOS)
        run: swift test --parallel
      - name: Generate Xcode project
        if: hashFiles('App/project.yml') != ''
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Pick simulator
        if: hashFiles('App/project.yml') != ''
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone"):
                      best=(rt,x["udid"],x["name"])
          print(best[1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test app
        if: hashFiles('App/project.yml') != ''
        run: |
          set +e
          cd App
          xcodebuild test \
            -project Sortly.xcodeproj \
            -scheme Sortly \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -E "error:|warning: .*Sortly|Test Suite|Test case|Executed|TAXONOMY|VISION_IDENTIFIERS|PREVIEW_JPEG|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -400
          exit $status
      - name: Build simulator app for browser testing
        if: hashFiles('App/project.yml') != ''
        run: |
          set -o pipefail
          cd App
          xcodebuild build \
            -project Sortly.xcodeproj \
            -scheme Sortly \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/sim \
            CODE_SIGNING_ALLOWED=NO | tail -5
          cd ../build/sim/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Sortly.app ../../../../Sortly-simulator.zip
          ls -la ../../../../Sortly-simulator.zip
      - name: Upload simulator app
        if: success() && hashFiles('build/Sortly-simulator.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Sortly-simulator-app
          path: build/Sortly-simulator.zip
          retention-days: 30
      - name: Export strings for translation
        if: success() && hashFiles('App/project.yml') != ''
        run: |
          cd App
          xcodebuild -exportLocalizations -project Sortly.xcodeproj -localizationPath ../build/loc -exportLanguage en CODE_SIGNING_ALLOWED=NO | tail -3
          find ../build/loc -name "*.xliff" -exec sh -c 'echo "XLIFF_BEGIN"; base64 -i "$1" | tr -d "\n"; echo; echo "XLIFF_END"' _ {} \;
      - name: Upload strings
        if: success() && hashFiles('build/loc/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: build/loc
          retention-days: 7
      - name: Upload logs
        if: always() && hashFiles('build-log.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build-log.txt
            build/TestResults.xcresult
          retention-days: 7
