name: UI flow

# End-to-end UI run on the simulator. Separate from CI with its own queue: a new push does
# not cancel a running UI flow (it takes ~30 min); the newest commit runs next.
on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-flow:
    # End-to-end run with the demo library: screenshots, timings and accessibility audit in the log.
    name: UI flow and accessibility (simulator)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Prepare simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py --pro)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant photos app.sortly.ios || echo "privacy grant failed"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
      - name: Run UI flow
        run: |
          set +e
          # SwiftUI reports broken navigation (link without destination) and similar runtime
          # problems only in the system log, so it is recorded during the whole run.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log stream --style compact --level debug \
            --predicate 'process == "Sortly" AND (subsystem == "com.apple.SwiftUI" OR messageType == fault OR eventMessage CONTAINS[c] "navigationDestination")' \
            > swiftui-log.txt 2>&1 &
          LOGPID=$!
          # Video of the plan being applied (the "photos fly into albums" show): recording starts
          # when the test opens the plan and stops a few seconds after the plan is done.
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p build
          (
            until grep -aq "UI_STEP_OK open plan" ui-log.txt 2>/dev/null; do sleep 1; done
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/sorting-show.mp4 > /dev/null 2>&1 &
            REC=$!
            for i in $(seq 1 240); do grep -aq "UI_TIMING apply" ui-log.txt 2>/dev/null && break; sleep 1; done
            sleep 3
            kill -INT $REC 2>/dev/null; wait $REC
          ) &
          WATCHPID=$!
          cd App
          xcodebuild test \
            -project Sortly.xcodeproj \
            -scheme SortlyUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../build/UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../ui-log.txt 2>&1
          status=$?
          kill $LOGPID 2>/dev/null
          pkill -INT -f "recordVideo" 2>/dev/null; sleep 2; kill $WATCHPID 2>/dev/null
          ls -la ../build/sorting-show.mp4 2>/dev/null && echo "UI_VIDEO sorting-show.mp4"
          # Artifact downloads are not reachable from every reviewer's machine, so a smaller copy of
          # the video is also printed into the log (base64 chunks, like the screenshots).
          if [ -f ../build/sorting-show.mp4 ]; then
            avconvert --source ../build/sorting-show.mp4 --output ../build/sorting-show-small.mp4 \
              --preset Preset1920x1080 --replace > /dev/null 2>&1 \
              || cp ../build/sorting-show.mp4 ../build/sorting-show-small.mp4
            bytes=$(stat -f%z ../build/sorting-show-small.mp4)
            echo "UI_VIDEO_SIZE $bytes"
            if [ "$bytes" -lt 25000000 ]; then
              base64 -i ../build/sorting-show-small.mp4 | tr -d '\n' | fold -w 60000 | awk '{print "UI_VIDEO_B64 " NR " " $0}'
            fi
          fi
          grep -aE "error:|UI_STEP|UI_SWEEP|UI_TIMING|UI_FACT|A11Y_|PREVIEW_JPEG|Test Case|Executed|\*\* |Testing failed|Fatal error|crashed" ../ui-log.txt | grep -v "/SourcePackages/" | head -8000
          # Unique runtime warnings from the app (timestamps cut off; scene setup and view dumps are noise).
          grep -avE "^Filtering|^Timestamp|SwiftUI:Scenes|_UIHostingView|renderbox" ../swiftui-log.txt | cut -c 25- | sort | uniq -c | sort -rn | head -40 | sed 's/^/UI_RUNTIME_WARNING /'
          if grep -aqiE "no matching navigationDestination|NavigationLink is presenting|cannot be activated" ../swiftui-log.txt; then
            echo "::error::SwiftUI navigation warning in the UI run (a link leads nowhere)"
            status=1
          fi
          if grep -aqiE "Publishing changes from within view updates|Modifying state during view update" ../swiftui-log.txt; then
            echo "::warning::SwiftUI state was changed during a view update (see UI_RUNTIME_WARNING)"
          fi
          exit $status
      - name: Upload video of the sorting show
        if: always() && hashFiles('build/sorting-show.mp4') != ''
        uses: actions/upload-artifact@v6
        with:
          name: sorting-show-video
          path: build/sorting-show.mp4
          retention-days: 14
