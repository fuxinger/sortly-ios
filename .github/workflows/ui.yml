name: UI flow
# A pull request run names the merge commit it tests (github.sha): ui_evidence.py reads it from
# the run list to tell that commit's app fingerprint without reading the run's jobs. Other runs
# keep their usual name (an empty run-name falls back to it).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('[merge {0}] {1}', github.sha, github.event.pull_request.title) || '' }}

# End-to-end UI tests on the simulator. Separate from CI, in the repository's one Mac queue
# (see "concurrency" below): one UI run or stress pass at a time across all branches, the newest
# waiting run goes next; a new push to a pull request cancels the UI runs of its older commits
# (ui-supersede.yml).
#
#   1. Core tests (Linux): the core library's tests on a free Linux runner. No macOS runner
#      starts for a commit whose core tests fail (fast first, then expensive).
#   2. UI build: builds the app and the UI tests once (build-for-testing) and hands them on.
#   3. The test groups (.github/ui-groups.json), each on its own runner and freshly booted
#      simulator (test-without-building), at most five at a time (max-parallel; three when
#      TestFlight calls it, beside its stress pass and Release smoke test), so the slowest
#      group sets the wall time, not the sum. Measured times per group: docs/TESTFLIGHT.md
#      ("Messung"). "other flows" is defined as "everything the other groups do not run", so a
#      new test class always runs somewhere and no test runs twice (test_ui_tests.py GroupTests
#      checks every UI test against the groups).
#      max-parallel 5 holds back the sixth group (the last listed, contrast) until one of the
#      five ends. With CI's one macOS job that is still six macOS jobs asked for at the peak,
#      for the first 15-25 min of the groups while CI's job still runs; the account runs five
#      at once, so one of the five started groups waits in GitHub's account queue until a Mac
#      is free, and which one GitHub picks is not fixed (a queued job waits, it never fails;
#      its timeout counts from its start). Tempo plan 20.11.: six groups of at most about 45
#      min instead of five with one of 56-65 min (before: max-parallel 4, five macOS jobs at
#      the peak, accepted on 16.11.).
#      The stress pass is not part of this run: .github/workflows/ui-stress.yml (10,000 photos
#      before each TestFlight build, 50,000 weekly at night and before the App Store launch).
#
# Which groups run (the owner's rule of 17.11., "UI plan" below, .github/scripts/ui_evidence.py):
#   - auto (pull requests, and the default of a run by hand or from TestFlight): only the groups
#     without a green result for exactly this app (app fingerprint) and their own test code (test
#     fingerprint of the group: its test files, the shared helpers they use, its definition and
#     the harness; .github/scripts/ui_groups.py). A test-only change runs the groups of the
#     changed files, a change to a shared helper every group that uses it, any app change all.
#   - all: every group; or group names (device flow-other accessibility device-flows flow-full
#     contrast).
#   Each group job carries both fingerprints in its name ("[device app ... tests ...]"); that is
#   where later runs and the TestFlight gate find the result again. A group whose result for
#   this app and test code was red runs again when asked, but its green never counts (a red test
#   is fixed, not re-run to green).
#   Quick mode (pull requests, or "quick" by hand; never in a TestFlight run): the tests get
#   ALBUMIST_UI_QUICK=1 and DeviceConditionUITests.test11_LargeLibrary (about 25 min) skips
#   itself. Every group has another test fingerprint then, so a quick green never stands for a
#   full one; a red in either mode blocks both.
#   The last job, "UI verdict (full|quick)", checks every group for this app and its test code
#   (the same check as the TestFlight gate), also when no group had to run; the release gate
#   (ci_gate.py) needs "UI verdict (full)" green.
#   A group whose every pass failed on the simulator or XCTest alone (lost before the first
#   test, testmanagerd crashed, also in the repeat) has no result (neither green nor red): its job
#   fails in "No test result (...)", not in "Run UI tests".
#
# Each group runs through .github/scripts/ui_tests.py: a pass that the simulator service lost
# (an explicit "Error returned in reply from CoreSimulatorService", "Timed out waiting for AX
# loaded notification", runner not installed or launched, ...) and in which neither the log,
# a crash report nor the result bundle shows anything about the app is repeated once, on an
# erased and newly prepared simulator, for the tests that did not pass only. A failed test,
# an error line, an accessibility finding, a crash, a timeout or a bare runner restart is
# never repeated, and a pass that ran no test fails. Result bundles and logs are uploaded
# when a group fails. Nothing is repeated silently: every repeat, every test that passed only
# on it and every failed boot attempt is a FLAKY... line in the group's log and job summary
# and goes into build/flaky-GROUP.json; 4. "UI summary" (Linux) counts them over all groups
# and lists the rows the tap-through sweep did not tap (UI_SWEEP_SKIP, also in that JSON). In a
# TestFlight run, testflight.yml does that instead, together with the stress pass's record.
on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      groups:
        description: 'auto (groups without a green result for this app and their test code), all, or group names'
        type: string
        default: auto
      quick:
        description: Quick (ALBUMIST_UI_QUICK=1, device test11_LargeLibrary skips itself); a quick result never counts for an upload
        type: boolean
        default: false
  # testflight.yml runs the UI flow for the commit it uploads, in the same run (release: true).
  workflow_call:
    inputs:
      release:
        description: Called by testflight.yml (own concurrency group, outside the Mac queue)
        type: boolean
        default: false
      groups:
        description: auto, all, or group names (see workflow_dispatch)
        type: string
        default: auto
      quick:
        description: Quick run (see workflow_dispatch); never with release
        type: boolean
        default: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # Quick mode (top of this file): pull requests and runs started with quick, never a TestFlight
  # run. The same expression is in the name of the "UI verdict" job (no env there).
  UI_QUICK: ${{ (!inputs.release && (github.event_name == 'pull_request' || inputs.quick)) && 'true' || '' }}

# The Mac queue (Profi-Analyse 16.11., Top 3, decided 17.11.: only one Mac-heavy strand at a
# time). Every UI run and every stress pass (ui-stress.yml) of every branch shares the group
# "mac-queue", and GitHub keeps such a group like this:
#   - one run at a time; the queue never cancels a running run (cancel-in-progress: false);
#   - at most ONE run waits. A run that joins while another one waits takes its place: GitHub
#     cancels the waiting one ("Canceling since a higher priority waiting request for
#     'mac-queue' exists"). So the newest waiting run always goes next, also across branches
#     and between UI runs and stress passes, and a run replaced like that has to be started
#     again ("Re-run all jobs") once the queue is free. The agent rule "only one Mac-heavy
#     strand at a time" (for the owner to add to the project rules) keeps that rare.
# Not in the queue, so never kept waiting or replaced by another run:
#   - the UI flow of a TestFlight run (testflight.yml calls this workflow with release: true;
#     github.workflow is then the caller's name "TestFlight", a second guard below): a group
#     of its own for that run, because a replaced or cancelled UI part would stop the upload.
#     Start TestFlight when the queue is idle; then it is the one Mac-heavy strand. Not yet
#     seen in a real run: check on the first TestFlight run that its UI flow and stress pass
#     do not wait for "mac-queue".
#   - the weekly full stress pass (ui-stress.yml, group "stress-weekly").
#   - pull requests from forks: one group of their own ("ui-fork"), so that a run from outside
#     the repository can neither replace nor hold up the runs in the queue.
#   - CI's macOS job (ci.yml), the quick verdict of every push (one Mac, ~20 min): in this
#     group it would wait behind the UI run of its own commit (about an hour), and while it
#     waits the next run to join, e.g. the UI run of the next push, would cancel it.
#   - the Mac jobs of nightly.yml and codeql.yml (one Mac each).
#   - runs on main (by hand or after a merge): a queue of their own, "mac-queue-main", since
#     19.11.2026. That day the stress pass dispatched on main after PR #9 waited in "mac-queue",
#     Dependabot rebased its pull request, and that UI run replaced the waiting pass. No pull
#     request can replace a run on main now; a run on main may run beside a pull request's run
#     (its jobs then wait for a free Mac, nothing is cancelled). Inside "mac-queue-main" a newer
#     run on main replaces a waiting older one, as before.
#   - Dependabot pull requests: group "ui-dependabot", and no job runs for them (plan below), so
#     a version bump uses no Mac and can never replace a waiting run. Before merging one, start
#     "UI flow" by hand on its branch (Run workflow); that run is in "mac-queue" like any other.
# The older run of the same pull request: cancel-in-progress cannot do it here (with one group
# for all branches it would cancel whatever runs, another branch's run too), so a newer push
# cancels the waiting or running UI runs of the older commits of its pull request in a
# workflow of its own, outside the queue: ui-supersede.yml (since 19.11.2026).
concurrency:
  group: >-
    ${{ (inputs.release || github.workflow == 'TestFlight') && format('testflight-ui-{0}', github.run_id)
    || (github.event.pull_request.head.repo.fork && 'ui-fork')
    || (github.event.pull_request.user.login == 'dependabot[bot]' && 'ui-dependabot')
    || (github.ref == 'refs/heads/main' && 'mac-queue-main' || 'mac-queue') }}
  cancel-in-progress: false

jobs:
  plan:
    # Which groups run (top of this file). Reads the earlier group jobs of ui.yml and
    # testflight.yml through the API (actions: read); when it cannot, every group runs.
    name: UI plan (which groups run)
    # Not for a Dependabot pull request (see "concurrency"): every later job needs this one, so
    # nothing runs and no Mac starts. The job "Dependabot: UI by hand" says so on the run page.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      known_red: ${{ steps.plan.outputs.known_red }}
      known_red_text: ${{ steps.plan.outputs.known_red_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of earlier results, to recompute their fingerprints from git.
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the UI groups
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UI_GROUPS: ${{ inputs.groups || 'auto' }}
        run: python3 .github/scripts/ui_evidence.py plan --groups "$UI_GROUPS" ${UI_QUICK:+--quick}

  known-red:
    # Tempo plan 20.11.: a group that is red for exactly this app and its test code makes the
    # verdict red whatever this run shows (a red test is never re-run to green). The plan knows
    # that at minute one; this job turns it into a red check at once instead of after the groups
    # (8b71209: the verdict was red after 69 min from a red of a cancelled run). The groups still
    # run (their results show whether the red came back); nothing is skipped or re-run, and the
    # verdict below decides as before. Not in a TestFlight run: its UI gate decides there.
    name: UI known red (verdict will be red)
    needs: plan
    if: ${{ needs.plan.outputs.known_red != '' && !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Red before for this app and test code
        env:
          KNOWN_RED: ${{ needs.plan.outputs.known_red }}
          KNOWN_RED_TEXT: ${{ needs.plan.outputs.known_red_text }}
        run: |
          echo "::error title=UI known red::$KNOWN_RED_TEXT. The verdict of this run will be red: fix the test or the app and push; a red test is never re-run to green."
          {
            echo "### UI groups already red for this app and test code: $KNOWN_RED"
            echo "$KNOWN_RED_TEXT"
            echo
            echo "The groups still run; their green does not count for this app and test code."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  dependabot-note:
    name: 'Dependabot: UI by hand'
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: No Mac for a version bump until someone starts the UI run
        run: |
          {
            echo "### UI flow: not started for a Dependabot pull request"
            echo "A version bump uses no Mac by itself, so it can never replace a waiting run on main"
            echo "(19.11.2026). Before the merge: Actions > UI flow > Run workflow on this branch."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::UI flow for Dependabot runs by hand before the merge (Run workflow on this branch)."

  core-linux:
    # Same tests as CI's "Core tests (Linux)" (CI runs them for this commit too, but a manual
    # UI run on a branch has no CI run to wait for). ~4 min on a free runner. Not in a
    # TestFlight run: there CI's own "Core tests (Linux)" of the same commit just passed (the
    # UI flow starts only after CI), so this would only add ~5 min before the UI build.
    name: Core tests (Linux)
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' && !inputs.release }}
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    # Hang limits as in CI's "Core tests (Linux)" (the watchdog names the tests still running,
    # swift_test_watch.py). This job, 61 green since 16.11.: p95 5.6, longest 7.0 min; 25 leaves
    # room for apt's retries (up to 11.6 min seen in CI during the mirror outage) and the step's 12.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SQLite headers
        run: bash .github/scripts/apt_install.sh libsqlite3-dev python3
      - name: Build and test
        timeout-minutes: 12
        run: python3 .github/scripts/swift_test_watch.py --minutes 10 --log core-linux.log -- swift test --parallel

  build:
    name: UI build
    needs: [plan, core-linux]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
      && (needs.core-linux.result == 'success' || (inputs.release && needs.core-linux.result == 'skipped')) }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256. Its own step:
        # a failed download is machinery for "Re-run failed jobs" (earlier_attempts.py); a
        # failed project generation is not.
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Build for testing
        run: |
          set +e
          cd App && xcodegen generate
          xcodebuild build-for-testing \
            -project Albumist.xcodeproj \
            -scheme AlbumistUI \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -aE "error:|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -100
          [ $status = 0 ] || exit $status
          set -e
          # Only what the tests run: the apps and the .xctestrun (no modules or objects).
          cd ../build/dd/Build/Products
          ls
          tar --exclude '*.swiftmodule' --exclude '*.o' --exclude '*.a' --exclude '*.swiftdoc' -czf "$GITHUB_WORKSPACE/ui-products.tgz" .
          ls -la "$GITHUB_WORKSPACE/ui-products.tgz"
      - name: Upload build products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-products
          path: ui-products.tgz
          # "Re-run failed jobs" of a group (after a runner or simulator failure) downloads
          # these again from the first attempt: 3 days for that, not just one.
          retention-days: 3
          compression-level: 0
          overwrite: true

  ui:
    # The group's fingerprints in its name: later runs and the TestFlight gate read them there
    # (.github/scripts/ui_evidence.py, JOB_NAME). Keep the bracket at the end.
    name: UI ${{ matrix.title }} [${{ matrix.group }} app ${{ matrix.app }} tests ${{ matrix.tests }}]
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: xcode-27
    # A group takes 25-65 min with 5-7 min of simulator setup; a repeat after a simulator
    # failure (erase, boot, the tests that did not pass) can add up to its length again, so the
    # longest group with a full repeat needs about 135 min.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Five groups + CI's macOS job = six asked for at the peak; the account queue holds one of
      # them, whichever GitHub picks, until a Mac is free (top of this file, tempo plan 20.11.).
      # Called by TestFlight (release): three, as the stress pass and the Release smoke test run
      # beside the groups there (CI's Mac job has ended), so five Macs at most, the account's
      # limit. The group order (.github/ui-groups.json) starts the longest in a full run
      # (device-flows, device, other flows) first, accessibility (the longest of the short ones)
      # on the first free Mac, then flow-full and contrast. Estimate for a full run (job minutes
      # from TestFlight run 44461253154 and the pull-request medians since 18.11.): about 70-76
      # min for the groups, before about 68-74; six jobs on three Macs cannot do better than
      # about 70 (second review of C7; test_workflows.py ReleaseSmokeTests).
      max-parallel: ${{ inputs.release && 3 || 5 }}
      # The groups of .github/ui-groups.json that run (UI plan): group, title, device, only,
      # skip, video, reduce_motion, increase_contrast, budget_min, app, tests.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GROUP: ${{ matrix.group }}
      DEVICE: ${{ matrix.device }}
      ONLY: ${{ matrix.only }}
      SKIP: ${{ matrix.skip }}
      INCREASE_CONTRAST: ${{ matrix.increase_contrast }}
      REDUCE_MOTION: ${{ matrix.reduce_motion }}
      VIDEO: ${{ matrix.video }}
      # Minutes; over it the group gets a warning, never red (ui_tests.py budget_check).
      BUDGET_MIN: ${{ matrix.budget_min }}
      # Quick mode (ALBUMIST_UI_QUICK=1 in the tests; xcodebuild hands TEST_RUNNER_* variables to
      # the test runner without the prefix): every group of a quick run (matrix.quick).
      TEST_RUNNER_ALBUMIST_UI_QUICK: ${{ matrix.quick && '1' || '' }}
    steps:
      - name: Note when the job started
        # For the deadline of the test passes ("Run UI tests"): timeout-minutes above minus 12
        # minutes for the steps after them, so a hang is stopped and reported as red by
        # ui_tests.py instead of being cut off by GitHub without a result.
        run: echo "UI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Boot simulator (in the background)
        id: sim
        # The first boot of a fresh simulator takes 3-7 min on the hosted Macs; it runs while
        # the build products are downloaded.
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device "$DEVICE")
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion)
          nohup python3 .github/scripts/ui_tests.py boot --udid "$UDID" "${flags[@]}" --ready-file sim-ready > sim-boot.log 2>&1 &
      - name: Download build products
        # v8 is the download action that pairs with upload-artifact v7 (its README).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-products
          path: products-download
      - name: Unpack build products
        run: |
          mkdir -p products
          tar -xzf products-download/ui-products.tgz -C products
          ls products
      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 180); do [ -f sim-ready ] && break; sleep 5; done
          cat sim-boot.log
          [ "$(cat sim-ready 2>/dev/null)" = ok ] || { echo "simulator did not boot"; exit 1; }
      - name: Built tests present
        # Its own step: a build without the .xctestrun is not a test result (ui_evidence.py
        # counts only "Run UI tests"); earlier_attempts.py counts it as machinery.
        id: built
        run: |
          XCTESTRUN=$(find products -maxdepth 1 -name '*.xctestrun' | sort | head -1)
          [ -n "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the build products"; exit 1; }
          echo "xctestrun=$XCTESTRUN" >> "$GITHUB_OUTPUT"
      - name: Run UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          XCTESTRUN: ${{ steps.built.outputs.xctestrun }}
        run: |
          set +e
          flags=()
          [ "$REDUCE_MOTION" = "true" ] && flags+=(--reduce-motion --a11y-summary)
          [ "$INCREASE_CONTRAST" = "true" ] && flags+=(--increase-contrast)
          [ "$VIDEO" = "true" ] && flags+=(--video build/sorting-show.mp4)
          python3 .github/scripts/ui_tests.py run --udid "$UDID" --name "$GROUP" --xctestrun "$XCTESTRUN" \
            --only "$ONLY" --skip "$SKIP" --deadline "$((UI_JOB_START + (150 - 12) * 60))" \
            --budget-min "${BUDGET_MIN:-0}" "${flags[@]}"
          status=$?
          # 75: every pass failed on the simulator or XCTest alone, no test result
          # (build/no-test-result); the next step fails the job, not this one.
          [ "$status" = 75 ] && exit 0
          exit "$status"
      - name: No test result (simulator or XCTest failed in every pass)
        # No test result for this group (ui_evidence.py: neither green nor red); the job fails
        # here so that the run is not green. earlier_attempts.py counts it as machinery.
        if: hashFiles('build/no-test-result') != ''
        run: |
          echo "::error title=UI $GROUP::no test result: $(cat build/no-test-result). Start the group again."
          exit 1
      - name: Job summary
        if: always()
        run: |
          args=()
          for log in build/*-log.txt; do [ -f "$log" ] && args+=(--swift-log "$log"); done
          python3 .github/scripts/test_summary.py summary --title "UI ${{ matrix.title }}" "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload video of the sorting show
        if: always() && matrix.video && hashFiles('build/sorting-show.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorting-show-video
          path: build/sorting-show.mp4
          retention-days: 14
          # "Re-run failed jobs" uploads it again under the same name.
          overwrite: true
      - name: Upload results
        # Crash logs, screens and attachments of a failed test are in the result bundles.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results-${{ matrix.group }}
          path: |
            build/*.xcresult
            build/*-log.txt
            build/*-swiftui.txt
            build/*-console-*.txt
            sim-boot.log
          retention-days: 7
          if-no-files-found: ignore
          # "Re-run failed jobs" uploads it again under the same name.
          overwrite: true
      - name: Keep the retry record for the run summary
        # build/flaky-*.json: repeats after a simulator failure and the tests that passed only
        # on them (ui_tests.py); the summary job below counts them over all groups. One record
        # per attempt: "Re-run failed jobs" keeps the earlier attempt's record next to its own.
        # GitHub's artifact service sometimes does not answer (UI run 44446270757, accessibility:
        # "Failed to CreateArtifact: Unable to make request: ETIMEDOUT" after all tests passed),
        # so a failed upload is tried once more a minute later; only if that fails too is the
        # job red (the record must not go missing from the count).
        id: flaky_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-flaky-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build/flaky-*.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - name: Wait before the second try of the retry record
        if: always() && steps.flaky_upload.outcome == 'failure'
        run: echo "FLAKY_UPLOAD retry record upload failed, second try in 60 s"; sleep 60
      - name: Keep the retry record for the run summary (second try)
        if: always() && steps.flaky_upload.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-flaky-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: build/flaky-*.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  verdict:
    # The run's verdict (the owner's rule of 17.11.): every group green for exactly this app and
    # its own test code, from this run or an earlier one, and none red for that pair; the same
    # check as the TestFlight gate (ui_evidence.py gate). Also when no group had to run. The
    # release gate (ci_gate.py) needs this job green in its full form; a quick verdict (pull
    # requests) never counts for an upload or a release.
    # Merge gate (the owner's decision of 20.11.2026, 17:12): "UI verdict (full)" of a full run
    # started on the pull request's branch, green on its last commit, with the merge content
    # unchanged (step "Merge content same as this commit"); the TestFlight run after the merge
    # then reuses those greens by content and runs only groups without one. Not in a TestFlight run: there the
    # "UI gate" of testflight.yml does this.
    name: UI verdict (${{ (!inputs.release && (github.event_name == 'pull_request' || inputs.quick)) && 'quick' || 'full' }})
    needs: [plan, ui]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions: read for the runs and jobs, checks: read for the flaky warnings of reused jobs.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of earlier results, to recompute their fingerprints from git.
          fetch-depth: 0
          persist-credentials: false
      - name: Full UI pass before the merge
        # The owner's decision of 20.11.2026, 17:12: the full UI pass runs once before the merge
        # (not again in the TestFlight run, whose UI gate takes its greens by content). A pull
        # request's own runs are quick; this says how to start the full one on its branch.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::notice title=Full UI pass before the merge::Once the last commit is pushed: Actions > UI stress > Run workflow on branch $HEAD_REF (first, the longest Mac job), then Actions > UI flow > Run workflow on it with quick off. 'UI stress verdict' and 'UI verdict (full)' must be green on the branch's last commit before the merge (docs/TESTFLIGHT.md)."
      - name: UI groups green for this app and test code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ui_evidence.py gate ${UI_QUICK:+--quick}
      - name: Merge content same as this commit
        # The full pass before the merge (decision 20.11.2026): its greens stand for the merge
        # only when merging this commit into main gives the same app fingerprint and the same
        # full test fingerprint of every group (ui_evidence.py merge-content, git merge-tree).
        # When main changed the app or test code since, or the merge conflicts, this is red:
        # merge main into the branch and run the full pass again (unchanged groups are reused).
        # Also after a red gate, so both reasons show at once.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.quick && github.ref != 'refs/heads/main' }}
        run: python3 .github/scripts/ui_evidence.py merge-content --base origin/main

  summary:
    name: UI summary (retries and flaky tests)
    # Linux only; reads the records of all groups, also of failed ones. It never fails the run:
    # the groups decide that. Nothing that was repeated stays hidden in a single job's log, and
    # neither does a row the tap-through sweep (UI test 3) left out: the records carry its
    # UI_SWEEP_SKIP lines, listed here per group (a real row taken for a section header shows).
    # In a TestFlight run, testflight.yml counts these records together with the stress pass's
    # ("Repeats and flaky tests"), so this job is left out there.
    needs: ui
    if: ${{ always() && needs.ui.result != 'skipped' && !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for the runs, jobs and retry records of the last days (UI history).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Download retry records
        # ui-flaky-<group>-attempt-<n>, every attempt's own (not merged: the records of one group
        # have the same file name in every attempt).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-flaky-*
          path: flaky
      - name: Count repeats and flaky tests
        run: |
          mapfile -t records < <(find flaky -name 'flaky-*.json' 2>/dev/null | sort)
          python3 .github/scripts/ui_tests.py flaky-summary "${records[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: UI history of the last 7 days
        # Every UI run's group jobs by result (test red, no result, machinery, cancelled; also
        # earlier attempts) and their repeats and flaky tests, across runs (review P5-06: 8 of 15
        # red runs were no app bug, and nobody counted them). .github/scripts/flaky_history.py;
        # it stops early so the UI plan and gate keep their API calls, and after 2 minutes. Never
        # fails the run: continue-on-error, its own time limit, and earlier_attempts.py counts it
        # as machinery (a re-run of it hides no test).
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky_history.py --days 7 >> "$GITHUB_STEP_SUMMARY"
