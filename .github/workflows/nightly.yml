name: Nightly

# Full run once a night, on things too slow for every push:
#   - the random-library stress test with many seeds (ALBUMIST_STRESS_SEEDS, 16 per push),
#   - the large-library load tests (20,000 / 100,000 photos, journal with 200 albums) on Linux
#     and macOS,
#   - a build in fresh DerivedData with the app tests in the simulator (CI builds without a
#     cache too: its cache steps, off since 16.11., were removed on 17.11., Profi-Analyse Top 10),
#   - Thread Sanitizer on the core (Linux) and the app's unit tests (macOS), sanitize.yml.
# Scheduled workflows only run from the default branch's copy of this file, so this starts once
# it is on main. It tests the commit it runs on: main at night, or the branch chosen under
# "Run workflow" when started by hand.
on:
  schedule:
    # 01:00 UTC = 02:00 in Berlin in winter (03:00 in summer; cron has no time zones).
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: Random libraries for the stress test
        type: string
        default: '300'
      only_tsan:
        description: Only the Thread Sanitizer pass on Linux (no Mac), to try sanitize.yml on a branch
        type: boolean
        default: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  ALBUMIST_STRESS_SEEDS: ${{ inputs.seeds || '300' }}

concurrency:
  group: nightly
  cancel-in-progress: false

# No checkout of another ref (CodeQL actions/cache-poisoning on PR #1 and PR #7): until 18.11. a
# "Pick the commit" job chose the development branch (claude/sortly-app, NIGHTLY_REF or a typed-in
# ref) and ran its code in the default branch's context. Since the release path merges into main,
# the nightly run tests the commit it was started on; the old default would have tested the
# retired claude/sortly-app. No workflow restores an Actions cache either (test_workflows.py).

jobs:
  core-linux:
    if: ${{ !inputs.only_tsan }}
    name: Stress and load tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tested code never sees a token in .git/config.
          persist-credentials: false
      - name: Install SQLite headers
        run: bash .github/scripts/apt_install.sh libsqlite3-dev python3
      - name: All core tests, stress test with ${{ env.ALBUMIST_STRESS_SEEDS }} seeds (clean build)
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee core.log
      - name: Load tests
        # Separately and after the other tests: their time limits assume an otherwise idle machine.
        run: |
          set +e
          ALBUMIST_LOAD_TEST=1 swift test --skip-build --filter "LoadTests|JournalLoadTests" > load.log 2>&1
          status=$?
          grep -E "LOAD_|passed|failed|error" load.log
          exit $status
      - name: Job summary
        if: always()
        run: |
          python3 .github/scripts/test_summary.py summary --title "Nightly: core, stress, load (Linux)" \
            --swift-log core.log --swift-log load.log --load-log load.log >> "$GITHUB_STEP_SUMMARY" || true

  macos:
    if: ${{ !inputs.only_tsan }}
    name: Clean build, stress, load and app tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tested code never sees a token in .git/config.
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256.
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Generate Xcode project
        run: cd App && xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py --role default)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Core tests with ${{ env.ALBUMIST_STRESS_SEEDS }} stress seeds
        run: |
          set -o pipefail
          mkdir -p build
          swift test --parallel 2>&1 | tee build/core.log
      - name: Load tests
        # Separately and after the other tests: their time limits assume an otherwise idle machine.
        run: |
          set +e
          ALBUMIST_LOAD_TEST=1 swift test --skip-build --filter "LoadTests|JournalLoadTests" > build/load.log 2>&1
          status=$?
          grep -E "LOAD_|passed|failed|error" build/load.log
          exit $status
      - name: Build (no cache) and test app
        # Deliberately without ci.yml's "Fresh simulator" step (18.11.): the nightly run is the
        # unchanged control for the StoreKit "no product" case.
        run: |
          set +e
          cd App
          xcodebuild test \
            -project Albumist.xcodeproj \
            -scheme Albumist \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/clean-dd" \
            -resultBundlePath ../build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -E "error:|Test Suite|Executed|\*\* |✘|recorded an issue|Test run with|Testing failed|Fatal error|crashed" ../build-log.txt | grep -v "/SourcePackages/" | head -2000
          exit $status
      - name: Job summary
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult > build/app-tests.json 2>/dev/null || true
          python3 .github/scripts/test_summary.py summary --title "Nightly: clean build and tests (macOS)" \
            --swift-log build/core.log --swift-log build/load.log --xcresult-json build/app-tests.json \
            --load-log build/load.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always() && hashFiles('build-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ios-log
          path: |
            build-log.txt
            build/core.log
            build/load.log
            build/TestResults.xcresult
          retention-days: 7

  tsan:
    name: Thread Sanitizer
    # Data races in the core (Linux) and in the app's unit tests (Mac, about 30 min), owner's
    # decision 16.11.2026; red on any report (sanitize.yml).
    uses: ./.github/workflows/sanitize.yml
    with:
      mac: ${{ !inputs.only_tsan }}

  # TODO(ui.yml): the UI flow in English and on a second device size (test plan A11, A16).
  # ui.yml can be called now (`workflow_call`, testflight.yml uses it), but its only input is
  # `release`. Once it also takes language and device, add here (a call without
  # release: true joins the Mac queue, see ui.yml):
  #
  # ui-english:
  #   uses: ./.github/workflows/ui.yml
  #   with: { language: en, device: 'iPhone 17 Pro' }
  # ui-second-device:
  #   uses: ./.github/workflows/ui.yml
  #   with: { language: de, device: 'iPhone 16e' }
