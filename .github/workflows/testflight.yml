name: TestFlight
# The daily build (gate small; daily-build.yml starts it) says so in the run list; every other
# run keeps the workflow's name (an empty run-name falls back to it).
run-name: >-
  ${{ inputs.gate == 'small' && 'TestFlight daily build (small gate, only for the owner)' || '' }}

# Builds a signed App Store build and uploads it to TestFlight, so Albumist can be installed on
# a real iPhone (docs/TESTFLIGHT.md). One run does it all for one commit (Profi-Analyse 16.11.,
# Top 10 / G8, decided 17.11.): it tests exactly that commit itself and, only when every test of
# its gate is green, archives, uploads and tags it, by itself (the owner's decision of 19.11.2026,
# which replaced the click of decision 5 of 18.11.). No job waits for or looks at other runs.
#
# Two gates (input "gate"; the owner's decision 10 of 18.11.2026, docs/TESTFLIGHT.md "Zwei Tore"):
#   - big (the default; every build for testers and the App Store): CI, the UI flow, the small
#     stress pass, the UI gate over every group. Every group needs a full green for exactly this
#     content; since the owner's decision of 20.11.2026, 17:12 the full UI pass runs once before
#     the merge (ui.yml by hand on the pull request's branch, quick off), and the UI flow here
#     runs only the groups without such a green (usually none), the gate takes the others.
#   - small (the daily build for the owner's own iPhone; daily-build.yml starts it each morning
#     when the app changed, and it can be started by hand): CI, the two short UI groups
#     flow-full and contrast (about 18 min each), the small stress pass, the UI gate over those
#     two groups. No other UI group. The run name, the tag message and "Was testen" say "small
#     gate"; such a build is not given to testers.
#   The stress pass belongs to both gates: the owner's rule 17.11. and his decision 4 want it
#   before every upload, and the daily build uploads too (an internal build for the owner).
#   Since the owner's decision of 20.11.2026, 17:20 it runs once before the merge (by hand on the
#   pull request's branch, beside the full UI pass); ui-stress.yml skips it here when a green
#   pass of 10,000 photos exists for exactly this content, and the UI gate checks it either way
#   (--stress 10000-15). Without such a green it runs here as before.
# Either way the upload follows the gates, without a click (the owner's decision of 19.11.2026):
# the upload job runs only from main and only when every gate below is green, in the GitHub
# environment "testflight-upload", which only the branch main may use, and the four App Store
# Connect secrets are environment secrets there, so only that job can read them
# (docs/launch/FREIGABE_EINRICHTEN.md). No other job of any workflow names them
# (.github/scripts/tests/test_workflows.py).
#
#   1. Upload setup (Linux, a minute): only on main, and only when the environment
#      testflight-upload exists and may be used from the branch main only (a custom rule for
#      exactly main; .github/scripts/upload_approval.py). A private repository stops here unless
#      the owner set the repository variable UPLOAD_PRIVATE_PLAN_OK to true: on GitHub Free
#      there are no environments in private repositories, a rule the API lists is not enforced,
#      and the token cannot read the plan. Otherwise the run stops here, before any macOS minute, and
#      names the setup steps. GitHub would create a missing environment without any rule as
#      soon as the upload job names it, so this check is what keeps the upload job from ever
#      starting without the fence. It reads no secret. When nothing requires a pull request on
#      main, it warns (never stops): whoever can push to main can upload.
#   2. Tests: CI (ci.yml) with the app rules, the Linux core tests and then, on one Mac, the
#      iOS build, core and app tests. Its iOS job always runs here.
#   3. Then side by side: the UI flow (ui.yml, at most four Macs) and the small stress pass
#      (ui-stress.yml with photos 10000 and minutes 15; the owner's rule 17.11.: before each
#      TestFlight build), with either gate, and the Release smoke test (job release-smoke: the
#      UI test target built with -configuration Release, one test that onboards, analyses and
#      applies a plan as a new user would; review P5-03: no test ever started the configuration
#      that is uploaded). Five Mac jobs at the peak (small gate: four): the UI flow runs at most
#      three groups at a time when called from here (ui.yml max-parallel), the longest first, so
#      the two short groups wait for a Mac and still end before it. The big
#      gate runs the UI flow with groups "auto" (input ui_groups): only the groups that have no
#      green result yet for exactly this app and their own test code (the owner's rule 17.11.: a
#      test-only change reruns only the groups it touches, any app change everything; ui.yml "UI
#      plan"); the small gate runs its two groups. "Repeats and flaky tests" then counts the
#      simulator repeats and the flaky tests of all three in one table.
#   3b. UI gate (Linux): every UI group of the gate must be green for exactly this app
#      fingerprint and its own test fingerprint, from this run or an earlier one, and none may be
#      red for that pair (a red is fixed, never re-run to green; .github/scripts/ui_evidence.py
#      gate). It names the reused results and their flaky tests.
#   4. Archive and upload, one Mac job, only when 1, 2, 3 and 3b are green (no click since
#      19.11.2026). Before the archive it reads the earlier attempts of this run (a red test is
#      never re-run to green, earlier_attempts.py). Then it archives
#      exactly this commit with the pinned Xcode and this run's number as the build number,
#      checks the app's Info.plist (commit, build number, Xcode build), signs it for the App
#      Store during the export, uploads it and sets "Was testen" from docs/TESTFLIGHT_NOTES.md as
#      soon as App Store Connect knows the build (at most 20 min; this is the only job with the
#      key). Archive and export happen in the same job: nothing is handed between machines, so
#      the app that is uploaded is the one built from the tested commit.
#   5. The commit gets the annotated git tag build-<number>; its message names the gate.
# Big gate: two to two and a half hours until the upload starts when every UI group runs (CI ~20 min,
# UI flow 75-100 min observed); after a test-only change only the touched groups run, and the
# stress pass (~45 min) sets the time. Small gate: about 70 min (CI ~20, then the stress pass
# ~45 sets the time; its two UI groups, ~20 with their build, run beside it). Then:
# archive and upload ~15-20 min, "Was testen" mostly a few minutes more (at most 20).
#
# Every part tests this run's commit (github.sha); only a UI group may instead be covered by an
# earlier green result for a byte-identical app and the same test code of that group (3b; the
# app fingerprint covers everything that goes into the app, ui_groups.py). The called workflows get a concurrency group
# of their own for this run (inputs.release; github.workflow, which is "TestFlight" in a called
# workflow, is a second guard): the Mac queue of ui.yml never holds or replaces them, and a push
# to main never cancels them. Start a TestFlight run when the Mac queue is idle (one Mac-heavy
# strand at a time).
#
# When something fails (the owner's rule: flaky tests are counted and fixed, never hidden):
#   - a red test: fix it and start a NEW run. A red test is never re-run to green: the upload
#     job of a later attempt stops when an earlier attempt failed in a test, a rule, a build or
#     the archive (.github/scripts/earlier_attempts.py).
#   - the same across runs: a UI group that was red for this app and this test code in any
#     earlier run (every run since this app first existed; when they cannot all be read, the
#     gate fails) blocks the upload until the test or the app changes (ui-gate,
#     .github/scripts/ui_evidence.py); a new run on the same code does not make it green.
#     The upload needs full results: a quick UI result (pull requests) never counts.
#   - "Re-run failed jobs" only for a failure of the machinery: a runner or container that did
#     not start, a simulator that did not boot, build products, a checkout or XcodeGen
#     (pinned download) that did not arrive, an upload to App Store Connect that broke off. The check
#     goes by the step that did not pass, not by the cause: a runner lost or a run cancelled in
#     the middle of a test step (e.g. "Run UI tests"), or a hiccup in "Select pinned Xcode" or
#     "Generate Xcode project", needs a new run too. The upload job of an allowed re-run lists
#     every earlier failure as a warning and in its summary, and the tag message names them.
#     The UI build products are kept 3 days for this.
#   - A run that uploaded is never re-run to a second upload: its first job and the start of the
#     upload job stop when the tag build-<run number> exists ("Not uploaded by this run yet",
#     upload_approval.py not-uploaded). A new build needs a new run (a new number).
#   - No input or flag skips a test or the gate: the emergency input that uploaded without any
#     test is gone (the owner's decision 17.11., review G5-02/G6-02; .github/scripts/tests/
#     test_workflows.py checks it). An urgent build waits for its tests like any other. The only
#     choice is the gate (big or small, both above, both decided by the owner), and every upload
#     follows every gate of its run (CI and its gate, the UI flow and the UI gate, the stress pass,
#     the Release smoke test, the earlier attempts).
#
# Started by hand: Actions > TestFlight > Run workflow on main (gh workflow run testflight.yml
# --ref main; -f gate=small for an internal build), and with the small gate by daily-build.yml
# once a day when the app changed (it starts no run while one runs or waits). No push or merge
# starts a build. On another branch the first job is skipped and with it the whole run, and the
# environment may be used from main only, too. The old
# release branch claude/sortly-app uploads nothing any more: since 1358f7f (the owner's decision
# 18.11., branch kept) its testflight.yml can only be started by hand and stops at once, with no
# secret, no Mac and no push trigger.
on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Gate: big (for testers and the App Store: every UI group, stress pass) or small (daily build only for the owner: CI, the UI groups flow-full and contrast, stress pass)'
        type: choice
        options: [big, small]
        default: big
      ui_groups:
        description: 'UI groups of the big gate: auto (only those without a green result for this app and their test code) or all'
        type: choice
        options: [auto, all]
        default: auto

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

# One TestFlight run at a time and none is cancelled: a second run waits (a third one would
# replace the waiting second), so builds reach App Store Connect in the order of their numbers.
# The group is held until the last job of the run ends, until "Was testen" is set in the upload
# job (daily-build.yml starts no run while one runs or waits). A workflow's group cannot be let go earlier; job
# groups instead would let two runs test at the same time (ten Macs).
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  check:
    # Step 1 (top of this file): only main, and only when the environment testflight-upload
    # exists and only main may use it. No secret is read here: the App Store Connect secrets are
    # environment secrets of testflight-upload, for the upload job alone. Also turns the gate
    # into the UI groups to run and to check. daily_build.py reads this job's name.
    name: Upload setup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for the environment's settings (GET /repos/{repo}/environments/{name}). The
    # rulesets of main and whether it has a branch protection need only read access; whether
    # that protection requires a pull request needs admin rights, which no job gets (the check
    # then warns that it could not read it).
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.setup.outputs.ready }}
      gate: ${{ steps.gate.outputs.gate }}
      ui_groups: ${{ steps.gate.outputs.ui_groups }}
      gate_groups: ${{ steps.gate.outputs.gate_groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Upload setup checked
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          # "true" only once the owner's plan has environments in private repositories (GitHub
          # Pro, Team or Enterprise); a private repository is refused without it.
          UPLOAD_PRIVATE_PLAN_OK: ${{ vars.UPLOAD_PRIVATE_PLAN_OK }}
        run: python3 .github/scripts/upload_approval.py check
      - name: Not uploaded by this run yet
        # "Re-run all jobs" on a run that uploaded stops here, before any Mac: its build number
        # (the run number) is in TestFlight already, and the tag job tagged it build-<number>.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upload_approval.py not-uploaded
      - name: Choose the gate
        id: gate
        env:
          GATE: ${{ inputs.gate || 'big' }}
          UI_GROUPS: ${{ inputs.ui_groups || 'auto' }}
          # The small gate's UI groups: the two short ones (docs/TESTFLIGHT.md, "Zwei Tore").
          SMALL_GATE_GROUPS: flow-full contrast
        run: |
          case "$GATE" in
            big) groups="$UI_GROUPS"; checked="" ;;
            small) groups="$SMALL_GATE_GROUPS"; checked="$SMALL_GATE_GROUPS" ;;
            *) echo "::error title=Gate::unknown gate $GATE (big or small)"; exit 1 ;;
          esac
          { echo "gate=$GATE"; echo "ui_groups=$groups"; echo "gate_groups=$checked"; } >> "$GITHUB_OUTPUT"
          echo "### Gate: $GATE (UI groups: $groups)" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    needs: check
    if: needs.check.outputs.ready == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    # CI's changes job (changes.yml) asks for actions: read; it is skipped here, but a called
    # workflow may never ask for more than its caller grants.
    permissions:
      contents: read
      actions: read

  ui:
    name: UI flow
    needs: [check, tests]
    uses: ./.github/workflows/ui.yml
    # actions: read for its "UI plan" (earlier results of the groups); checks: read for its
    # "UI verdict" job, which is skipped here (release) but must not ask for more than it gets.
    # quick stays false: the upload needs full results.
    permissions:
      contents: read
      actions: read
      checks: read
    with:
      release: true
      quick: false
      # Big gate: auto or all (input ui_groups); small gate: its two groups (job check).
      groups: ${{ needs.check.outputs.ui_groups }}

  stress:
    name: Stress pass
    # Both gates (the owner's rule 17.11. and decision 4: before every upload, the daily build
    # included, as it uploads too).
    needs: tests
    uses: ./.github/workflows/ui-stress.yml
    # actions: read for its "Stress plan" (earlier passes, reuse by content); checks: read for its
    # "UI stress verdict", which is skipped here (release) but must not ask for more than it gets.
    permissions:
      contents: read
      actions: read
      checks: read
    with:
      release: true
      # The small pass (the owner's rule 17.11.), named here rather than left to defaults.
      photos: '10000'
      minutes: '15'

  release-smoke:
    # Review P5-03: every UI test runs a Debug build (ui.yml builds without a configuration),
    # where UITestSupport.isRunning and the app's #if DEBUG code change what runs; the Release
    # build that is uploaded was never started before (only the archive below and ci.yml's
    # manual Appetize job build Release, and neither runs it). Here the UI test target is built
    # with -configuration Release and one test (App/AlbumistUITests/ReleaseSmokeUITests.swift)
    # does what a new user does: onboarding, demo library and analysis, a plan applied in
    # Photos. Both gates; the upload needs it green.
    # Beside the UI flow and the stress pass (it needs the tests only), so the upload waits no
    # longer: ~10-20 min Release build (the simulator boots meanwhile) and ~10-15 min test,
    # less than the stress pass (~45 min) or the longest UI group. Never more than five Macs
    # (the account's limit; second review of C7): with this job and the stress pass beside it,
    # the UI flow runs at most three groups at a time here (ui.yml max-parallel in release), the
    # longest (device conditions, 62 min) first; the short groups that wait end before it, so
    # the run takes no longer (TestFlight run 44461253154). Not after the stress pass or the UI
    # flow: that would add the whole ~30 min of this job to the run.
    # A red here is not remembered across runs (second review of C7, decided so): within a run
    # "Re-run failed jobs" cannot turn it green (earlier_attempts.py: its build and test steps
    # block), but a NEW run on the same app runs it again, unlike a UI group or, since 20.11.2026,
    # the stress pass, whose red the UI gate keeps for that app and test code by the key in the
    # job's name (ui_evidence.py, gate --stress). The daily build never starts a new run on a
    # commit that already was in a TestFlight run, or that adds only docs to one
    # (daily_build.py); by hand, fix the cause first. Keeping it like the stress pass would need
    # this job's own key in its name and a check in the UI gate; not done.
    # Unverified until a Mac run.
    name: Release build smoke test (UI)
    needs: tests
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Note when the job started
        # For the deadline of the test pass (ui_tests.py --deadline): timeout-minutes above minus
        # 12 minutes for the steps after it, as in ui.yml.
        run: echo "UI_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: python3 .github/scripts/toolchain.py xcode --runtime
      - name: Boot simulator (in the background)
        id: sim
        run: |
          UDID=$(python3 .github/scripts/ui_tests.py pick --device pro)
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          nohup python3 .github/scripts/ui_tests.py boot --udid "$UDID" --ready-file sim-ready > sim-boot.log 2>&1 &
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256. Its own step:
        # a failed download is machinery for "Re-run failed jobs" (earlier_attempts.py).
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Build for testing (Release)
        run: |
          set +e
          cd App && xcodegen generate
          xcodebuild build-for-testing \
            -project Albumist.xcodeproj \
            -scheme AlbumistUI \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > ../build-log.txt 2>&1
          status=$?
          grep -aE "error:|\*\* " ../build-log.txt | grep -v "/SourcePackages/" | head -100
          [ $status = 0 ] || exit $status
          # The app under test is the Release build and nothing else.
          products=../build/dd/Build/Products
          ls "$products"
          [ -d "$products/Release-iphonesimulator/Albumist.app" ] || { echo "::error::no Release-iphonesimulator/Albumist.app in the build products"; exit 1; }
          [ ! -d "$products/Debug-iphonesimulator" ] || { echo "::error::a Debug build in the products of the Release smoke test"; exit 1; }
      - name: Wait for the simulator
        run: |
          for _ in $(seq 1 180); do [ -f sim-ready ] && break; sleep 5; done
          cat sim-boot.log
          [ "$(cat sim-ready 2>/dev/null)" = ok ] || { echo "simulator did not boot"; exit 1; }
      - name: Built tests present
        id: built
        run: |
          XCTESTRUN=$(find build/dd/Build/Products -maxdepth 1 -name '*.xctestrun' | sort | head -1)
          [ -n "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the build products"; exit 1; }
          echo "xctestrun=$XCTESTRUN" >> "$GITHUB_OUTPUT"
      - name: Run UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          XCTESTRUN: ${{ steps.built.outputs.xctestrun }}
          # xcodebuild hands TEST_RUNNER_* variables to the tests without the prefix; without it
          # the test skips itself (as in ui.yml).
          TEST_RUNNER_ALBUMIST_RELEASE_SMOKE: '1'
        run: |
          set +e
          python3 .github/scripts/ui_tests.py run --udid "$UDID" --name release-smoke --xctestrun "$XCTESTRUN" \
            --only ReleaseSmokeUITests --deadline "$((UI_JOB_START + (75 - 12) * 60))" --budget-min 30
          status=$?
          # 75: every pass failed on the simulator or XCTest alone; the next step fails the job.
          [ "$status" = 75 ] && exit 0
          [ "$status" = 0 ] || exit "$status"
          # ui_tests.py counts a skipped test as done; a pass needs the test to have passed (in
          # the first pass or in its repeat after a simulator failure).
          PASSED="Test Case '-[AlbumistUITests.ReleaseSmokeUITests test1_ReleaseBuildOnboardsAnalysesAndApplies]' passed"
          for f in build/release-smoke-log.txt build/release-smoke-retry-log.txt; do
            if [ -f "$f" ] && grep -aqF "$PASSED" "$f"; then exit 0; fi
          done
          echo "::error title=Release smoke test::the test did not pass (skipped: ALBUMIST_RELEASE_SMOKE did not reach it?)"
          exit 1
      - name: No test result (simulator or XCTest failed in every pass)
        if: hashFiles('build/no-test-result') != ''
        run: |
          echo "::error title=Release smoke test::no test result: $(cat build/no-test-result). Re-run this job."
          exit 1
      - name: Job summary
        if: always()
        run: |
          args=()
          for log in build/*-log.txt; do [ -f "$log" ] && args+=(--swift-log "$log"); done
          python3 .github/scripts/test_summary.py summary --title "Release build smoke test" "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results-release-smoke
          path: |
            build/*.xcresult
            build/*-log.txt
            build-log.txt
            sim-boot.log
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Keep the retry record for the run summary
        # build/flaky-release-smoke.json, counted by the job "flaky" below and by the UI history
        # (flaky_history.py); a second try a minute later, as in ui.yml.
        id: flaky_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-flaky-release-smoke-attempt-${{ github.run_attempt }}
          path: build/flaky-*.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - name: Wait before the second try of the retry record
        if: always() && steps.flaky_upload.outcome == 'failure'
        run: echo "FLAKY_UPLOAD retry record upload failed, second try in 60 s"; sleep 60
      - name: Keep the retry record for the run summary (second try)
        if: always() && steps.flaky_upload.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-flaky-release-smoke-attempt-${{ github.run_attempt }}
          path: build/flaky-*.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  flaky:
    # The simulator repeats and the tests that passed only on a repeat, over the UI groups, the
    # stress pass and the Release smoke test of this run, in one table (ui_tests.py
    # flaky-summary over their build/flaky-*.json): nothing that was repeated stays hidden in a
    # single job's log. Never fails the run; the tests decide that.
    name: Repeats and flaky tests (UI flow and stress pass)
    needs: [ui, stress, release-smoke]
    if: >-
      ${{ always() && (needs.ui.result != 'skipped' || needs.stress.result != 'skipped'
      || needs.release-smoke.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for the runs, jobs and retry records of the last days (UI history).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Download retry records
        # ui-flaky-<group>-attempt-<n> (ui.yml) and flaky-stress-attempt-<n> (ui-stress.yml): one
        # per attempt, so "Re-run failed jobs" keeps the records of the earlier attempts. Not
        # merged, as every attempt's record of a group has the same file name.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*flaky-*'
          path: flaky
      - name: Count repeats and flaky tests
        run: |
          mapfile -t records < <(find flaky -name 'flaky-*.json' 2>/dev/null | sort)
          python3 .github/scripts/ui_tests.py flaky-summary "${records[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: UI history of the last 7 days
        # Every UI run's group jobs by result (test red, no result, machinery, cancelled; also
        # earlier attempts) and their repeats and flaky tests, across runs (review P5-06: 8 of 15
        # red runs were no app bug, and nobody counted them). .github/scripts/flaky_history.py;
        # it stops early so the UI plan and gate keep their API calls, and after 2 minutes. Never
        # fails the run: continue-on-error, its own time limit, and earlier_attempts.py counts it
        # as machinery (a re-run of it hides no test).
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky_history.py --days 7 >> "$GITHUB_STEP_SUMMARY"

  ui-gate:
    # Every UI group of the gate green for exactly this app and its own test code (this run's
    # groups or a reused earlier result), none red for that pair; see .github/scripts/
    # ui_evidence.py. Big gate: every group; small gate: its two (--groups). Linux, before the Mac
    # job. If the API does not answer it fails; re-run this job then (earlier_attempts.py counts
    # it as machinery: it decides from the results alone). The stress pass must be green with
    # either gate.
    name: UI gate (every group of the gate green for this app and its test code)
    needs: [check, tests, ui, stress]
    if: >-
      ${{ !cancelled() && needs.check.outputs.ready == 'true' && needs.tests.result == 'success'
      && needs.ui.result == 'success' && needs.stress.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions: read for the runs and jobs, checks: read for the flaky warnings of reused jobs.
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      text: ${{ steps.gate.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: UI groups green for this app and test code
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for the big gate (every group); the small gate's two groups.
          GATE_GROUPS: ${{ needs.check.outputs.gate_groups }}
        run: |
          # The stress pass of this run or, since the owner's decision of 20.11.2026, 17:20, the
          # one before the merge for exactly this content (ui-stress.yml skips it then).
          if [ -n "$GATE_GROUPS" ]; then
            python3 .github/scripts/ui_evidence.py gate --groups "$GATE_GROUPS" --stress 10000-15
          else
            python3 .github/scripts/ui_evidence.py gate --stress 10000-15
          fi

  release:
    name: Archive and upload to TestFlight
    needs: [check, tests, ui, stress, release-smoke, ui-gate]
    # The tests, the UI flow, the stress pass, the Release smoke test and the UI gate of this run
    # must all be green, with either gate; nothing skips them.
    if: >-
      ${{ !cancelled() && needs.check.outputs.ready == 'true' && needs.tests.result == 'success'
      && needs.ui.result == 'success' && needs.stress.result == 'success'
      && needs.release-smoke.result == 'success' && needs.ui-gate.result == 'success' }}
    # No click since the owner's decision of 19.11.2026 (it replaced decision 5 of 18.11.): the job
    # starts when every gate above is green, in the environment testflight-upload, which only
    # the branch main may use (job check made sure it exists with that rule, so this job never
    # creates an environment without it), and only there gets its secrets (the four App Store
    # Connect secrets are environment secrets, docs/launch/FREIGABE_EINRICHTEN.md). The only job
    # of any workflow that names this environment or these secrets (test_workflows.py).
    environment: testflight-upload
    runs-on: xcode-27
    # Archive ~10-20 min, export and upload ~3-5 min, "Was testen" mostly a few minutes (at most 20).
    timeout-minutes: 85
    # actions: read for "Earlier attempts of this run".
    permissions:
      contents: read
      actions: read
    # For the tag message: the attempt that uploaded, and what failed before it.
    outputs:
      attempt: ${{ github.run_attempt }}
      earlier: ${{ steps.earlier.outputs.text }}
    # The App Store Connect key reaches this job's steps only after the archive is built: its
    # ids are in the environment of the upload step and of "Was testen", the private key is
    # written to disk in the step before the export and removed at the end. The build steps (the
    # repository's own code, no third-party packages; the pinned xcodegen as in every Mac job)
    # never have them, but unlike the two Mac jobs before 17.11. they run on the same machine as
    # the export. The team id (not secret) is only in the archive and upload steps. The first
    # step only learns whether the four secrets are set, never their values.
    steps:
      - name: App Store Connect secrets present
        # First, so a missing secret stops the job before the archive. An
        # expression that yields true or false: no secret value is in this step.
        env:
          PRESENT: >-
            ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != ''
            && secrets.APPLE_TEAM_ID != '' }}
        run: |
          [ "$PRESENT" = true ] || { echo "::error title=App Store Connect secrets::ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID must all be secrets of the environment testflight-upload (docs/launch/FREIGABE_EINRICHTEN.md); add the missing ones, then re-run this job"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; no token stays in .git/config next to the build.
          persist-credentials: false
      - name: Not uploaded by this run yet
        # As in the first job, for a re-run of this job alone: the tag build-<run number> means
        # this run uploaded its build already; stop before the archive.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upload_approval.py not-uploaded
      - name: Earlier attempts of this run
        # "Re-run failed jobs" is only for a failure of the machinery (top of this file). This
        # step reads every job and step of the earlier attempts of this run: a failure of the
        # machinery is listed (warning and summary), any other failure (a test, a rule, a build,
        # the archive) stops the upload: a red test is never re-run to green. If the API does not
        # answer, this step fails; re-run this job then.
        id: earlier
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          answers=()
          for n in $(seq 1 $((ATTEMPT - 1))); do
            curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$n/jobs?per_page=100" \
              -o "$RUNNER_TEMP/jobs-$n.json" \
              || { echo "::error title=Earlier attempts::the jobs of attempt $n could not be read; re-run this job"; exit 1; }
            answers+=("$RUNNER_TEMP/jobs-$n.json")
          done
          python3 .github/scripts/earlier_attempts.py --attempt "$ATTEMPT" "${answers[@]}"
      - name: Select pinned Xcode
        # The pinned release Xcode (.github/toolchain.json), never a beta: App Store Connect
        # refuses beta builds.
        run: python3 .github/scripts/toolchain.py xcode
      - name: Paths
        run: |
          {
            echo "ARCHIVE=$RUNNER_TEMP/Albumist.xcarchive"
            echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8"
            echo "EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"
      - name: Install XcodeGen
        # The pinned version (.github/toolchain.json), checked against its sha256. Its own step:
        # a failed download is machinery for "Re-run failed jobs" (earlier_attempts.py); a
        # failed project generation is not.
        run: python3 .github/scripts/toolchain.py xcodegen
      - name: Generate Xcode project
        run: cd App && xcodegen generate
      # The archive is built unsigned: automatic signing would want a development profile,
      # and Apple only makes one when an iPhone is registered to the team. The export below
      # signs for the App Store with Apple's cloud-managed distribution certificate (needs the
      # Admin key), which works without any registered device. DEVELOPMENT_TEAM stays in the
      # archive because the export has only been proven with it (a team id is not secret).
      # The build number is this workflow's run number: it only grows (build 27 was run 27).
      - name: Archive (unsigned; signed for the App Store during export)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd App
          set +e
          xcodebuild archive \
            -project Albumist.xcodeproj \
            -scheme Albumist \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ALBUMIST_COMMIT="$GITHUB_SHA" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > ../archive-log.txt 2>&1
          status=$?
          grep -E "error:|\*\* ARCHIVE" ../archive-log.txt | head -80
          exit $status
      - name: Archive of the tested commit
        # The checkout is this run's commit, and the app's own Info.plist says so too: it names
        # the commit (AlbumistCommit), this run's build number (CFBundleVersion) and the build of
        # the pinned Xcode (DTXcodeBuild), see .github/scripts/archive_check.py.
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout is not $GITHUB_SHA"; exit 1; }
          python3 .github/scripts/archive_check.py "$ARCHIVE" --sha "$GITHUB_SHA" --build "${{ github.run_number }}" --pinned-xcode
      - name: App Store Connect key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          plutil -create xml1 "$EXPORT_OPTIONS"
          plutil -insert method -string app-store-connect "$EXPORT_OPTIONS"
          plutil -insert destination -string upload "$EXPORT_OPTIONS"
          plutil -insert signingStyle -string automatic "$EXPORT_OPTIONS"
          plutil -insert teamID -string "$TEAM_ID" "$EXPORT_OPTIONS"
          plutil -insert uploadSymbols -bool YES "$EXPORT_OPTIONS"
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" > upload-log.txt 2>&1
          status=$?
          grep -E "error:|Upload|EXPORT|\*\* " upload-log.txt | head -80
          [ $status -eq 0 ] && echo "TESTFLIGHT_BUILD ${{ github.run_number }} uploaded; it appears in TestFlight after Apple's processing (usually 5 to 30 minutes)."
          [ $status -eq 0 ] && echo "### TestFlight build ${{ github.run_number }} uploaded (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Set "Was testen" for this build
        # From docs/TESTFLIGHT_NOTES.md, once App Store Connect knows the build (usually a few
        # minutes after the upload, before Apple has processed it). Here and not in a Linux job
        # of its own, because only this job gets the key. At most 20 min
        # on this Mac. A failure never touches the upload, which is done already: the script
        # warns and exits 0, and continue-on-error keeps the job green.
        continue-on-error: true
        timeout-minutes: 25
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GATE: ${{ needs.check.outputs.gate }}
        run: |
          python3 .github/scripts/testflight_notes.py upload --notes docs/TESTFLIGHT_NOTES.md \
            --build "${{ github.run_number }}" --sha "$GITHUB_SHA" --bundle-id app.albumist.ios \
            --wait-minutes 20 --gate "$GATE"
      - name: App Store Connect addresses of the website
        # Since the repository rename (21.11.2026) the Pages site is fuxinger.github.io/albumist-ios;
        # the old address is gone. Moves every address of the old site in App Store Connect (privacy
        # policy, support, marketing, TestFlight's privacy policy) to the same path on the new one,
        # nothing else (asc_urls.py; the owner's "Mach selber" of 21.11.). Here, because only this
        # job gets the key; a run with nothing left to move only reads. Never touches the upload.
        continue-on-error: true
        timeout-minutes: 5
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 .github/scripts/asc_urls.py fix --bundle-id app.albumist.ios
      - name: Remove key
        if: always()
        run: if [ -n "${KEY_PATH:-}" ]; then rm -rf "$(dirname "$KEY_PATH")"; fi

  tag:
    # Every uploaded build has an annotated git tag build-<number> on exactly the commit it was
    # built from, so "which code is TestFlight build 41?" is `git show build-41`; its message
    # names the attempt and what failed before it. The only job of this workflow
    # that may write to the repository, and it can only create a tag: an existing tag is left
    # alone when it is on the same commit (a re-run) and fails the job otherwise.
    name: Tag the TestFlight build
    needs: [check, release, ui-gate]
    # always(), not the default success(): an uploaded build gets its tag even when the run is
    # cancelled after the upload.
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          # The attempt whose upload job uploaded (a re-run of this job alone keeps it) and,
          # from attempt 2 on, what failed before it (earlier_attempts.py).
          ATTEMPT: ${{ needs.release.outputs.attempt }}
          EARLIER: ${{ needs.release.outputs.earlier }}
          # Which UI groups ran in this run and which green results were reused (ui_evidence.py).
          UI_GATE: ${{ needs.ui-gate.outputs.text }}
          GATE: ${{ needs.check.outputs.gate }}
        run: |
          about="TestFlight build $GITHUB_RUN_NUMBER of $GITHUB_SHA (run $GITHUB_RUN_ID, attempt ${ATTEMPT:-$GITHUB_RUN_ATTEMPT}${EARLIER:+; $EARLIER}${UI_GATE:+; $UI_GATE})"
          if [ "$GATE" = small ]; then
            message="$about: small gate (daily build for the owner, not for testers): CI, the UI groups of the small gate and the stress pass green"
          else
            message="$about: CI, UI flow and stress pass green"
          fi
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r type existing <<< "$ref"
            # An annotated tag points at a tag object, which points at the commit.
            if [ "$type" = "tag" ]; then
              existing=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq .object.sha)
            fi
            [ "$existing" = "$GITHUB_SHA" ] \
              || { echo "::error::$TAG already points at $existing, not at $GITHUB_SHA; left as it is"; exit 1; }
            echo "$TAG is already on ${GITHUB_SHA:0:7}"
          else
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$message" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
            echo "Tagged ${GITHUB_SHA:0:7} as $TAG: $message"
          fi
          echo "Git tag \`$TAG\` on ${GITHUB_SHA:0:7}: $message" >> "$GITHUB_STEP_SUMMARY"
